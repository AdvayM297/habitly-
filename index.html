<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Habitly – Personal Health & Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#14304a;--mut:#64798c;--line:#e4eaf0;--blue:#4f98d9;--blue2:#e6f1fb;--mint:#2fc79a;--mint2:#e0f6ee;--bad:#e07a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#15263a;--ink:#e6eff7;--mut:#8da3b7;--line:#233a52;--blue:#6db0ec;--blue2:#1b3550;--mint:#43d9ae;--mint2:#133a33;--bad:#e8907f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 8px}h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.02em}h2{font-size:1.6rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mut{color:var(--mut)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--blue2);color:var(--blue)}.btn.m{background:var(--mint);color:#06352a}.btn.big{padding:14px 28px;font-size:1.05rem}.btn.r{background:transparent;color:var(--bad);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.grid .card{margin:0}.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .5s}
.big-n{font-size:1.9rem;font-weight:700}.big-n small{font-size:.8rem;color:var(--mut);font-weight:500}
.step,.dot{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}.step:hover,.dot:hover{background:var(--blue2)}.dot.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.arc{animation:draw 1s ease-out}@keyframes draw{from{stroke-dasharray:0 999}}@media(prefers-reduced-motion:reduce){.arc{animation:none}*{transition:none!important}}
.app{display:flex;min-height:100vh}nav{width:220px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
nav b{font-size:1.2rem;padding:0 10px 14px}nav a{display:flex;gap:10px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--mut);font-weight:600}nav a.on,nav a:hover{background:var(--blue2);color:var(--blue)}
main{flex:1;min-width:0;padding:26px;max-width:1100px}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:12px}input,select,textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}textarea{min-height:64px}
.fg{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.fg label.w{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto;margin:0}
.ch{width:100%;height:auto}.ch text{fill:var(--mut);font-size:9px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center}.cal span{font-size:.75rem;color:var(--mut)}.day{padding:8px 0;border-radius:10px;font-size:.85rem}
.day.full{background:var(--mint);color:#06352a}.day.part{background:var(--blue2);color:var(--blue)}.day.miss{background:var(--bg);box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--mint2);color:var(--mint);font-size:.8rem;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw}.hero{display:grid;gap:30px;grid-template-columns:1.2fr 1fr;align-items:center;padding:6vh 5vw}
.land{padding:0 5vw 40px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:9}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{width:38%;color:var(--mut);font-weight:600}
.err{color:var(--bad);font-size:.85rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}.app{display:block}main{padding:18px 14px 90px}nav{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border-top:1px solid var(--line);border-right:0;justify-content:space-around}nav b{display:none}nav a{flex-direction:column;align-items:center;gap:0;font-size:.68rem;padding:6px 8px}}
@media print{nav,.noprint,.toast{display:none!important}main{padding:0}.card{border:0}body{background:#fff;color:#000}}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db={habits:[],logs:{},weights:[]};try{db=JSON.parse(localStorage.getItem('hh'))||db}catch(e){}
const save=()=>{try{localStorage.setItem('hh',JSON.stringify(db))}catch(e){toast('Could not save on this device')}};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ds(new Date());
const L=d=>{const l=db.logs[d]||(db.logs[d]={});l.h=l.h||{};return l};
function toast(m){const e=$('#t');e.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';setTimeout(()=>e.innerHTML='',2200)}
// metric: key,name,icon,unit,target,step,lowerIsBetter
const M=[['water','Water','💧','glasses',8,1],['sleep','Sleep','🌙','hrs',8,.5],['steps','Steps','👟','steps',8000,500],['exercise','Exercise','🏃','min',30,5],['meals','Meals','🍽️','meals',3,1],['screen','Screen time','📱','hrs',4,.5,1],['mood','Mood','😊','of 5',5,1],['stress','Stress','🧘','of 5',5,1,1]];
const sc=k=>k=='mood'||k=='stress',mt=k=>M.find(m=>m[0]==k);
function pct(k,v){if(v==null)return null;const t=mt(k)[4];return k=='stress'?(6-v)/5:k=='screen'?(v<=t?1:t/v):Math.min(1,v/t)}
const habitPct=d=>{if(!db.habits.length)return null;const h=(db.logs[d]||{}).h||{};return db.habits.filter(x=>(h[x.id]||0)>=x.t).length/db.habits.length};
function score(d){const l=db.logs[d]||{},p=M.map(m=>pct(m[0],l[m[0]])).filter(x=>x!=null),h=habitPct(d);if(h!=null&&(p.length||h>0))p.push(h);return p.length?Math.round(p.reduce((a,b)=>a+b)/p.length*100):0}
const days=(n,o=0)=>[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i)-o);return ds(d)});
const avg=(k,D)=>{const v=D.map(d=>(db.logs[d]||{})[k]).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length*10)/10:null};
function ring(p,s,big,sub){const r=s/2-9,c=2*Math.PI*r,m=s/2;return `<svg width="${s}" height="${s}" role="img" aria-label="${big} ${sub}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle class="arc" cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--mint)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${m} ${m})"/><text x="${m}" y="${m+4}" text-anchor="middle" font-size="${s/4}" font-weight="700" fill="var(--ink)">${big}</text><text x="${m}" y="${m+s/6}" text-anchor="middle" font-size="${s/12}" fill="var(--mut)">${sub}</text></svg>`}
function barsV(D,V,mx,col,t){const n=D.length,w=300/n;return `<svg viewBox="0 0 300 140" class="ch">${t?`<line x1="0" x2="300" y1="${120-t/mx*105}" y2="${120-t/mx*105}" stroke="var(--mint)" stroke-dasharray="4 3"/>`:''}${V.map((v,i)=>{const h=v?v/mx*105:0;return `<rect x="${i*w+w*.15}" y="${120-h}" width="${w*.7}" height="${h}" rx="3" fill="${col}"><title>${D[i]}: ${v??'no entry'}</title></rect>`}).join('')}<line x1="0" x2="300" y1="120" y2="120" stroke="var(--line)"/><text x="0" y="136">${D[0].slice(5)}</text><text x="300" y="136" text-anchor="end">${D[n-1].slice(5)}</text></svg>`}
const bars=(k,n,col)=>{const D=days(n),V=D.map(d=>(db.logs[d]||{})[k]??null),t=mt(k)[4];return barsV(D,V,Math.max(t,...V.map(v=>v||0)),col,t)}
function line(sets,n,lo,hi){const x=i=>10+i/Math.max(n-1,1)*280,y=v=>120-(v-lo)/((hi-lo)||1)*105;return `<svg viewBox="0 0 300 140" class="ch"><line x1="0" x2="300" y1="120" y2="120" stroke="var(--line)"/>${sets.map(s=>{const p=s.p.filter(q=>q[1]!=null);return `<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${p.map(q=>x(q[0])+','+y(q[1])).join(' ')}"/>`+p.map(q=>`<circle cx="${x(q[0])}" cy="${y(q[1])}" r="3" fill="${s.c}"><title>${q[1]}</title></circle>`).join('')}).join('')}<text x="0" y="136">${lo}</text><text x="300" y="136" text-anchor="end">${hi}</text></svg>`}
// ---- actions
function adj(k,d){const l=L(today()),m=mt(k);l[k]=Math.max(0,Math.round(((l[k]??0)+d*m[5])*10)/10);save();render()}
function setv(k,v){L(today())[k]=v;save();render()}
function hadj(id,d){const l=L(today());l.h[id]=Math.max(0,(l.h[id]||0)+d);save();render()}
function addH(e){e.preventDefault();const f=e.target,n=f.n.value.trim(),t=+f.t.value;if(!n||!(t>=1)){toast('Add a habit name and a target of 1 or more');return}db.habits.push({id:Date.now().toString(36),name:n,desc:f.d.value.trim(),t,unit:f.u.value.trim()||'times',time:f.r.value});save();render();toast('Habit added')}
function editH(id){const h=db.habits.find(x=>x.id==id),n=prompt('Habit name',h.name);if(!n)return;const t=+prompt('Daily target',h.t);if(t>=1){h.name=n;h.t=t;save();render()}}
function delH(id){if(confirm('Remove this habit and its history?')){db.habits=db.habits.filter(x=>x.id!=id);save();render()}}
let cm=new Date();cm.setDate(1);const mv=n=>{cm.setMonth(cm.getMonth()+n);render()};let per=7;const setP=n=>{per=n;render()};
function addW(e){e.preventDefault();const w=+e.target.w.value;if(!(w>=20&&w<=300)){toast('Enter a weight between 20 and 300 kg');return}db.weights=db.weights.filter(x=>x.d!=today());db.weights.push({d:today(),w});save();render()}
function seed(){days(30).forEach((d,i)=>{if(db.logs[d])return;const r=(a,b)=>Math.round((a+Math.random()*(b-a))*2)/2;db.logs[d]={water:r(4,10)|0,sleep:r(5.5,8.5),steps:Math.round(r(3000,11000)/500)*500,exercise:Math.round(r(0,50)/5)*5,meals:r(2,4)|0,screen:r(2,8),mood:r(2,5)|0||3,stress:r(1,5)|0||2,h:Object.fromEntries(db.habits.map(h=>[h.id,Math.random()>.35?h.t:0]))}});save();render();toast('Sample history added')}
function wipe(){if(confirm('Delete your account and all health data from this device? This cannot be undone.')){localStorage.removeItem('hh');db={habits:[],logs:{},weights:[]};location.hash='';render()}}
// ---- auth
let auth=null;const A=m=>{auth=m;render()};
async function hs(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function doAuth(e){e.preventDefault();const f=e.target,em=f.em.value.trim().toLowerCase(),h=await hs(em+f.pw.value),er=$('#er');
if(auth=='signup'){if(db.user){er.textContent='An account already exists on this device. Log in instead.';return}if(!f.cn.checked){er.textContent='Please give consent to continue.';return}db.user={em,h,name:f.nm.value.trim()};db.consent=new Date().toISOString();db.session=1;save();auth=null;location.hash='profile';render()}
else{if(!db.user||db.user.em!=em||db.user.h!=h){er.textContent='Email or password does not match.';return}db.session=1;save();auth=null;location.hash='dashboard';render()}}
function logout(){db.session=0;save();location.hash='';render()}
// ---- profile
const YN='Yes,No,Prefer not to say',Q='Rarely,Weekly,Several times a week,Daily';
const F=[['Personal information',[['name','Full name','t',1],['dob','Date of birth','date',1],['gender','Gender (optional)','s','Female,Male,Non-binary,Prefer not to say'],['height','Height (cm)','n',1,[50,250]],['weight','Weight (kg)','n',1,[20,300]],['blood','Blood group (optional)','s','A+,A-,B+,B-,AB+,AB-,O+,O-,Unknown'],['job','Occupation','t'],['act','Daily activity level','s','Sedentary,Lightly active,Moderately active,Very active']]],
['Medical history',[['cond','Existing medical conditions','a'],['diab','Diagnosed with diabetes?','s',YN],['bp','High or low blood pressure?','s',YN],['heart','Heart-related conditions?','s',YN],['thy','Thyroid problems?','s',YN],['allergy','Allergies','a'],['meds','Current medications','a'],['surg','Past surgeries','a'],['fam','Significant family medical history','a'],['sym','Symptoms to mention to your doctor','a']]],
['Lifestyle and daily habits',[['sleepAvg','Average sleep (hours/day)','n',0,[0,24]],['waterAvg','Average water (glasses/day)','n',0,[0,30]],['mealsAvg','Meals per day','n',0,[0,10]],['bfast','Eat breakfast regularly?','s',YN],['junk','Junk food frequency','s',Q],['fv','Fruit and vegetable frequency','s',Q],['caff','Consume caffeine?','s',YN],['smoke','Smoke or use tobacco?','s',YN],['alc','Consume alcohol?','s',YN],['ex','Exercise frequency','s','Never,1–2 days/week,3–4 days/week,5+ days/week'],['scr','Daily screen time (hours)','n',0,[0,24]],['stp','Daily walking steps','n',0,[0,60000]]]],
['Mental health and well-being',[['stressLv','Daily stress level','s','Low,Moderate,High,Very high'],['anx','Anxiety frequency','s','Rarely,Sometimes,Often,Almost daily'],['moodLv','Overall mood','s','Poor,Fair,Good,Excellent'],['exh','Mentally exhausted during the day?','s',YN],['sleepQ','Satisfaction with sleep quality','s','Poor,Fair,Good,Excellent']]]];
const GOALS=['Improve sleep quality','Maintain a healthy weight','Increase physical activity','Improve eating habits','Reduce stress','Drink more water','Improve mental well-being','Build a consistent daily routine'];
function fld(x,p){const[i,l,t,a,b]=x,v=p[i]??'',req=t=='t'||t=='date'||t=='n'?(a===1?'required':''):'';
const inp=t=='s'?`<select name="${i}"><option value="">Skip</option>${a.split(',').map(o=>`<option ${v==o?'selected':''}>${o}</option>`).join('')}</select>`:t=='a'?`<textarea name="${i}" placeholder="Optional">${esc(v)}</textarea>`:`<input name="${i}" type="${t=='n'?'number':t=='date'?'date':'text'}" value="${esc(v)}" ${req} ${t=='n'?`step="any" min="${(b||[0])[0]}" max="${(b||[0,1e6])[1]}"`:''} ${t=='date'?`max="${today()}"`:''}>`;
return `<label class="${t=='a'?'w':''}">${l}${req?' *':''}${inp}</label>`}
function saveP(e){e.preventDefault();const f=e.target;if(!f.reportValidity())return;const p={};F.forEach(s=>s[1].forEach(x=>p[x[0]]=f[x[0]].value.trim()));p.goals=GOALS.filter((g,i)=>f['g'+i].checked);db.profile=p;db.weights=db.weights.filter(x=>x.d!=today());db.weights.push({d:today(),w:+p.weight});save();toast('Health profile saved');location.hash='dashboard';render()}
// ---- recommendations
function recs(){const D=days(7),p=db.profile||{},r=[],a=k=>avg(k,D),s=a('sleep')??+p.sleepAvg,w=a('water')??+p.waterAvg,e=a('exercise'),st=a('stress'),sc2=a('screen')??+p.scr;
if(s&&s<7)r.push(['🌙','Improve your sleep routine','Your sleep averages under 7 hours. Adults generally do well with 7–9. Try a fixed bedtime, dim lights and screens an hour before bed, and keep caffeine to the morning.']);
if(w&&w<6)r.push(['💧','Drink more water','Your intake is below 6 glasses a day. Keep a bottle nearby and pair a glass with each meal or habit you already do.']);
if(e!=null&&e<20||p.ex=='Never')r.push(['🏃','Move a little more each day','Short walks count. Aim for about 150 minutes of moderate activity a week, built up in small steps you can keep.']);
if(['Daily','Several times a week'].includes(p.junk)||p.fv=='Rarely')r.push(['🥗','Improve your eating habits','Try adding one fruit or vegetable to each meal, and swap one processed snack a day for a whole-food option.']);
if(st>=4||['High','Very high'].includes(p.stressLv))r.push(['🧘','Practice stress management','Slow breathing for two minutes, a short walk outside, or writing down what is on your mind can help. Talking with someone you trust also helps.']);
if(sc2>6)r.push(['📱','Take screen breaks','Try the 20-20-20 rule: every 20 minutes, look at something 20 feet away for 20 seconds.']);
if(!r.length)r.push(['✅','You are on a steady track','Keep logging each day. Consistency is what makes patterns visible.']);
return r.map(x=>`<div class="card"><h3>${x[0]} ${x[1]}</h3><p class="mut" style="margin:0">${x[2]}</p></div>`).join('')+'<p class="mut" style="font-size:.85rem">These suggestions are general wellness information, not medical advice, diagnosis or treatment. Speak with a qualified clinician about health concerns.</p>'}
// ---- views
const V={};
const mc=m=>{const[k,n,i,u,t]=m,v=(db.logs[today()]||{})[k],p=pct(k,v);return `<div class="card"><div class="row sp"><b>${i} ${n}</b><span class="mut">${sc(k)?(k=='mood'?'1 low – 5 high':'1 calm – 5 high'):'goal '+t+' '+u}</span></div><div class="big-n">${v??'–'} <small>${sc(k)?'':u}</small></div><div class="bar"><i style="width:${(p||0)*100}%"></i></div><div class="row">${sc(k)?[1,2,3,4,5].map(x=>`<button class="dot ${v==x?'on':''}" onclick="setv('${k}',${x})" aria-label="${n} ${x}">${x}</button>`).join(''):`<button class="step" onclick="adj('${k}',-1)" aria-label="Decrease ${n}">−</button><button class="step" onclick="adj('${k}',1)" aria-label="Increase ${n}">+</button>`}</div></div>`};
const hc=h=>{const v=(db.logs[today()]||{}).h?.[h.id]||0,p=Math.min(1,v/h.t);return `<div class="card"><div class="row sp"><b>${esc(h.name)}</b>${v>=h.t?'<span class="pill">✓ Done</span>':''}</div><div class="mut">${esc(h.desc)}${h.time?' · reminder '+h.time:''}</div><div class="bar"><i style="width:${p*100}%"></i></div><div class="row sp"><span>${v} / ${h.t} ${esc(h.unit)}</span><span class="row"><button class="step" onclick="hadj('${h.id}',-1)" aria-label="Decrease">−</button><button class="step" onclick="hadj('${h.id}',1)" aria-label="Increase">+</button><button class="btn g" onclick="editH('${h.id}')">Edit</button><button class="btn r" onclick="delH('${h.id}')">Remove</button></span></div></div>`};
V.dashboard=()=>{const s=score(today()),p=db.habits.filter(h=>((db.logs[today()]||{}).h||{})[h.id]>=h.t).length;return `<h2>Hello, ${esc((db.profile?.name||db.user.name).split(' ')[0])}</h2><p class="mut">${new Date().toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}</p>
<div class="card row" style="gap:24px">${ring(s/100,150,s,'health score')}<div><h3>Today’s health score</h3><p class="mut" style="margin:0;max-width:46ch">${s?`Built from the metrics you have logged today${db.habits.length?` and ${p} of ${db.habits.length} habits completed`:''}.`:'Log your first metric below to see your score.'}</p></div></div>
<div class="grid">${M.map(mc).join('')}</div><h3 style="margin-top:22px">Wellness suggestions</h3>${recs()}`};
V.habits=()=>{const y=cm.getFullYear(),m=cm.getMonth(),n=new Date(y,m+1,0).getDate();let c='<i></i>'.repeat(cm.getDay());for(let d=1;d<=n;d++){const k=ds(new Date(y,m,d)),p=habitPct(k);c+=`<div class="day ${p==null?'':p>=1?'full':p>0?'part':k<today()?'miss':''}">${d}</div>`}
return `<h2>My habits</h2><form class="card" onsubmit="addH(event)"><div class="fg"><label>Habit name *<input name="n" maxlength="40" placeholder="Read for 20 minutes"></label><label>Description<input name="d" maxlength="80"></label><label>Daily target *<input name="t" type="number" min="1" value="1"></label><label>Unit<input name="u" placeholder="pages, glasses…"></label><label>Daily reminder<input name="r" type="time"></label></div><div class="row"><button class="btn m">Add habit</button><button type="button" class="btn g" onclick="Notification.requestPermission().then(p=>toast(p=='granted'?'Reminders on while this tab is open':'Reminders blocked'))">Enable reminders</button></div></form>
${db.habits.map(hc).join('')||'<div class="card mut">No habits yet. Add one above to start your streak.</div>'}
<div class="card"><div class="row sp"><button class="btn g" onclick="mv(-1)" aria-label="Previous month">‹</button><b>${cm.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="btn g" onclick="mv(1)" aria-label="Next month">›</button></div><div class="cal">${[...'SMTWTFS'].map(x=>`<span>${x}</span>`).join('')}${c}</div><p class="mut" style="font-size:.8rem">Green: all habits done · Blue: some done · Red outline: missed</p></div>`};
V.profile=()=>{const p=db.profile||{};return `<h2>Health profile</h2><p class="mut">Only you can see this information. It is stored on this device. Skip any optional question and update it whenever you need.</p><form onsubmit="saveP(event)" novalidate>${F.map(s=>`<div class="card"><h3>${s[0]}</h3><div class="fg">${s[1].map(x=>fld(x,p)).join('')}</div></div>`).join('')}<div class="card"><h3>Health goals</h3>${GOALS.map((g,i)=>`<label class="chk"><input type="checkbox" name="g${i}" ${(p.goals||[]).includes(g)?'checked':''}>${g}</label>`).join('')}</div><button class="btn big m">Save profile</button></form><div class="card" style="margin-top:20px"><h3>Privacy</h3><p class="mut">You gave consent on ${db.consent?new Date(db.consent).toLocaleDateString():'signup'}. Your data is never shown publicly.</p><button class="btn r" onclick="wipe()">Delete my account and data</button></div>`};
V.analytics=()=>{const D=days(per),P=days(per,per),has=D.some(d=>db.logs[d]);const cmp=M.map(m=>{const a=avg(m[0],D),b=avg(m[0],P),d=a!=null&&b!=null?Math.round((a-b)*10)/10:null;return `<tr><th>${m[2]} ${m[1]}</th><td>${a??'–'}</td><td>${b??'–'}</td><td>${d==null?'–':(d>0?'+':'')+d}</td></tr>`}).join('');
const hp=D.map(d=>habitPct(d)||0),done=hp.length?Math.round(hp.reduce((a,b)=>a+b)/hp.length*100):0,W=db.weights.slice(-12),wv=W.map(x=>x.w);
const ct=(t,s)=>`<div class="card"><h3>${t}</h3>${s}</div>`;
return `<div class="row sp"><h2>Analytics</h2><span class="row"><button class="btn ${per==7?'':'g'}" onclick="setP(7)">Weekly</button><button class="btn ${per==30?'':'g'}" onclick="setP(30)">Monthly</button></span></div>
${has?'':'<div class="card row sp"><span class="mut">No data yet. Log a few days, or preview with sample data.</span><button class="btn g" onclick="seed()">Load sample data</button></div>'}
<div class="card"><h3>This period vs previous ${per} days</h3><table><tr><th>Average</th><th>Now</th><th>Before</th><th>Change</th></tr>${cmp}</table></div>
<div class="grid g2">${ct('🌙 Sleep pattern (hrs)',bars('sleep',per,'var(--blue)'))}${ct('💧 Water (glasses)',bars('water',per,'var(--blue)'))}${ct('🏃 Exercise consistency (min)',bars('exercise',per,'var(--mint)'))}${ct('✅ Habit completion · '+done+'% avg',barsV(D,hp,1,'var(--mint)',0))}
${ct('😊 Mood (blue) and 🧘 stress (red)',line([{c:'var(--blue)',p:D.map((d,i)=>[i,(db.logs[d]||{}).mood??null])},{c:'var(--bad)',p:D.map((d,i)=>[i,(db.logs[d]||{}).stress??null])}],per,1,5))}
${ct('⚖️ Weight history (kg)',(wv.length>1?line([{c:'var(--blue)',p:wv.map((v,i)=>[i,v])}],wv.length,Math.floor(Math.min(...wv)-1),Math.ceil(Math.max(...wv)+1)):'<p class="mut">Log weight on two different days to see a trend.</p>')+`<form class="row" onsubmit="addW(event)"><input name="w" type="number" step="0.1" placeholder="Today’s weight" style="width:150px"><button class="btn g">Log</button></form>`)}</div>`};
V.reports=()=>{const p=db.profile||{},D=days(7),a=k=>avg(k,D)??'no data',kv=(k,v)=>v?`<tr><th>${k}</th><td>${esc(v)}</td></tr>`:'',w=db.weights.at(-1);
const age=p.dob?Math.floor((Date.now()-new Date(p.dob))/315576e5):'';
return `<div class="row sp noprint"><h2>Doctor’s health report</h2><button class="btn m" onclick="window.print()">Download as PDF</button></div><p class="mut noprint">Choose “Save as PDF” in the print window. Review the report before sharing it with your physician.</p>
<div class="card"><h2>Health summary</h2><p class="mut">Generated ${new Date().toLocaleDateString()} by Habitly · self-reported, not a diagnosis</p>
<h3>Personal information</h3><table>${kv('Name',p.name)}${kv('Age',age)}${kv('Gender',p.gender)}${kv('Height / weight',p.height?p.height+' cm / '+(w?w.w:p.weight)+' kg':'')}${kv('Blood group',p.blood)}${kv('Occupation',p.job)}${kv('Activity level',p.act)}</table>
<h3 style="margin-top:16px">Medical history</h3><table>${kv('Conditions',p.cond)}${kv('Diabetes',p.diab)}${kv('Blood pressure issues',p.bp)}${kv('Heart conditions',p.heart)}${kv('Thyroid problems',p.thy)}${kv('Allergies',p.allergy)}${kv('Current medications',p.meds)}${kv('Surgeries',p.surg)}${kv('Family history',p.fam)}</table>
<h3 style="margin-top:16px">Lifestyle</h3><table>${kv('Breakfast regularly',p.bfast)}${kv('Junk food',p.junk)}${kv('Fruit and vegetables',p.fv)}${kv('Caffeine',p.caff)}${kv('Tobacco',p.smoke)}${kv('Alcohol',p.alc)}${kv('Exercise',p.ex)}${kv('Stress / anxiety / mood',[p.stressLv,p.anx,p.moodLv].filter(Boolean).join(' / '))}${kv('Sleep quality',p.sleepQ)}</table>
<h3 style="margin-top:16px">Last 7 days (averages from daily logs)</h3><table><tr><th>Sleep</th><td>${a('sleep')} hrs</td></tr><tr><th>Water</th><td>${a('water')} glasses</td></tr><tr><th>Steps</th><td>${a('steps')}</td></tr><tr><th>Exercise</th><td>${a('exercise')} min</td></tr><tr><th>Screen time</th><td>${a('screen')} hrs</td></tr><tr><th>Mood / stress (1–5)</th><td>${a('mood')} / ${a('stress')}</td></tr></table>
<h3 style="margin-top:16px">Symptoms and goals</h3><table>${kv('Reported symptoms',p.sym)}${kv('Health goals',(p.goals||[]).join(', '))}</table></div>`};
// ---- shell
function landing(){return `<header class="top"><b style="font-size:1.2rem">🩺 Habitly</b><span class="row"><button class="btn g" onclick="A('login')">Log in</button><button class="btn" onclick="A('signup')">Sign up</button></span></header><div class="hero"><div><h1>Take Control of Your Health, One Habit at a Time.</h1><p class="mut" style="font-size:1.1rem;max-width:48ch">Log sleep, water, movement, mood and meals in one calm dashboard. See how your lifestyle shapes how you feel, and bring a clear summary to your next doctor’s visit.</p><button class="btn m big" onclick="A('signup')">Get Started</button></div><div class="card row" style="justify-content:center;gap:20px">${ring(.82,150,82,'health score')}<div><b>Today</b><div class="mut">💧 7 / 8 glasses<br>🌙 7.5 hrs sleep<br>👟 8,200 steps</div></div></div></div>
${auth?`<div class="land"><form class="card" style="max-width:420px;margin:0 auto" onsubmit="doAuth(event)"><h3>${auth=='signup'?'Create your account':'Welcome back'}</h3>${auth=='signup'?'<label>Your name<input name="nm" required></label>':''}<label>Email<input name="em" type="email" required></label><label>Password<input name="pw" type="password" minlength="8" required></label>${auth=='signup'?'<label class="chk"><input type="checkbox" name="cn">I consent to Habitly storing my health information on this device. It is private to me and never shown publicly.</label>':''}<p id="er" class="err" role="alert"></p><button class="btn m">${auth=='signup'?'Create account':'Log in'}</button> <button type="button" class="btn g" onclick="A('${auth=='signup'?'login':'signup'}')">${auth=='signup'?'I have an account':'Create account'}</button>${auth=='login'?'<p><a href="#" onclick="event.preventDefault();wipe()" class="mut">Forgot password? Reset this device</a></p>':''}</form></div>`:''}
<div class="land"><h2>Why track your habits?</h2><div class="grid"><div class="card"><h3>🔍 See your patterns</h3><p class="mut">Spot how sleep, stress and activity connect over weeks.</p></div><div class="card"><h3>🔁 Build routines</h3><p class="mut">Small daily targets and reminders turn into lasting habits.</p></div><div class="card"><h3>📈 Measure progress</h3><p class="mut">Weekly and monthly charts show what is improving.</p></div><div class="card"><h3>🩺 Talk to your doctor</h3><p class="mut">Export a structured summary of your history and trends.</p></div></div><p class="mut" style="margin-top:24px;font-size:.85rem">Habitly offers general wellness information only. It does not diagnose conditions or recommend medication.</p></div>`}
function render(){const r=location.hash.slice(1)||'dashboard',app=$('#app');if(!db.session){app.innerHTML=landing();return}if(!db.profile&&r!='profile'){location.hash='profile';return}
const N=[['dashboard','📊','Dashboard'],['habits','✅','My Habits'],['profile','👤','Health Profile'],['analytics','📈','Analytics'],['reports','📄','Reports']],v=V[r]?r:'dashboard';
app.innerHTML=`<div class="app"><nav aria-label="Main"><b>🩺 Habitly</b>${N.map(n=>`<a href="#${n[0]}" class="${n[0]==v?'on':''}"><span>${n[1]}</span>${n[2]}</a>`).join('')}<a href="#" onclick="event.preventDefault();logout()" style="margin-top:auto"><span>🚪</span>Log out</a></nav><main>${V[v]()}</main></div>`}
addEventListener('hashchange',render);render();
setInterval(()=>{const n=new Date(),t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');db.habits.forEach(h=>{if(h.time==t&&h.fired!=ds(n)+t){h.fired=ds(n)+t;toast('Reminder: '+h.name);try{if(Notification.permission=='granted')new Notification('Habitly',{body:h.name})}catch(e){}}})},20000);
</script></body></html>
